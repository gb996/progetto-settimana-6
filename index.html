<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier — Studio di architettura</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>

    <header>
      <!-- Navbar Bootstrap (navbar-expand-md, sticky in cima) -->
        <nav class="navbar navbar-expand-md bg-dark navbar-dark sticky-top">
      <div class="container">

        <a class="navbar-brand fw-bold" href="#">Atelier</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#nav-menu"
                aria-controls="nav-menu" aria-expanded="false"
                aria-label="Apri menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav-menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#prodotti">Studio</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Servizi</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contatti</a></li>
          </ul>
          <button id="toggle-tema" type="button" class="btn btn-outline-light ms-md-2 mt-2 mt-md-0">Tema scuro</button>
        </div>

      </div>
    </nav>
    </header>

    <section id="studio">
      <!-- Hero: titolo grande, sottotitolo, CTA. Sfondo brand. min-height 80vh -->
<div class="text-white text-center d-flex flex-column justify-content-center gap-4 " style="height: 70vh;">
            <div class="container">
              <h1 class="fs-1 fw-bold mb-2">Architettura per spazi che parlano</h1>
              <p class="fs-5 m-0">Progettiamo case, uffici e spazi commerciali con attenzione alla luce, ai materiali e al contesto</p>
            </div>
            <div>
            <button type="button" class="btn btn-outline-light border-0">Inizia progetto</button>
            </div>
          </div>
    
    </section>

    <section id="servizi">
      <!-- 3 card servizi affiancate da md in su -->
    </section>

    <section id="contatti">
      <!-- Form contatti Bootstrap, larghezza limitata e centrata -->
    </section>

    <footer>
      <!-- 3 colonne: Atelier+indirizzo / Link / Contatti. Copyright in fondo -->
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
